<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة TRONSPIN العالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; }
        .wheel-rotate { transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <header class="border-b border-slate-800 bg-[#0f1626] p-4 flex justify-between items-center z-40">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🦅</span>
            <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-500">TRONSPIN</span>
        </div>
        <div id="userHeaderZone" class="flex items-center gap-3">
            <button onclick="document.getElementById('authModal').classList.remove('hidden')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-5 py-2 rounded-xl text-sm transition-all">
                تسجيل الدخول
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center my-8">
        
        <div id="adminPanelSection" class="w-full max-w-4xl bg-gradient-to-br from-slate-900 to-red-950/40 border border-red-900/50 rounded-2xl p-6 mb-8 hidden">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-2xl text-red-500">👑</span>
                <h2 class="text-xl font-black text-red-400">لوحة تحكم المسؤول العام الفائقة</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                    <label class="block text-xs text-gray-400 mb-2">نسبة فوز اللاعبين (%)</label>
                    <input type="number" id="adminWinChance" value="30" class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg p-2 text-center text-amber-400 font-bold">
                </div>
                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                    <label class="block text-xs text-gray-400 mb-2">الرابط الإعلاني الذكي الحالي</label>
                    <input type="text" id="adminSmartLink" value="https://omg10.com/4/11047850" class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg p-2 text-xs text-center text-emerald-400">
                </div>
                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl flex items-end">
                    <button onclick="saveAdminSettings()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg transition-all text-sm">
                        حفظ التعديلات السحابية
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-[#131a26] border border-slate-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-md w-full relative">
            <div id="balanceDisplay" class="absolute top-4 right-4 bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-xs font-bold text-amber-400">
                الرصيد: $0.00
            </div>
            
            <h2 class="text-2xl font-black text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-500">عجلة الحظ الكبرى</h2>
            
            <div class="relative w-64 h-64 mb-8">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 -top-3 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-amber-500 z-20"></div>
                <div id="luckyWheel" class="w-full h-full rounded-full border-4 border-slate-700 bg-gradient-to-tr from-amber-500 via-slate-800 to-yellow-600 wheel-rotate flex items-center justify-center font-black text-2xl shadow-xl">
                    🎯
                </div>
            </div>

            <button onclick="spinTheWheel()" id="spinButton" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 font-extrabold py-4 rounded-2xl shadow-lg shadow-yellow-500/10 hover:scale-[1.02] active:scale-[0.98] transition-all text-lg">
                إبدأ اللف الآن (اربح TRON)
            </button>
        </div>
    </main>

    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-[#131a26] border border-slate-800 w-full max-w-md rounded-2xl p-6 relative shadow-2xl">
            <button onclick="document.getElementById('authModal').classList.add('hidden')" class="absolute top-4 left-4 text-gray-500 hover:text-white text-xl">✕</button>
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-3">
                    <span class="text-amber-500 text-2xl">🔐</span>
                </div>
                <h3 class="text-lg font-bold">بوابة الدخول الموحدة</h3>
                <p class="text-xs text-gray-500 mt-1">سجل دخولك عبر خوادم الأمان لتفعيل حسابك</p>
            </div>

            <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-100 text-gray-900 font-bold py-3 px-4 rounded-xl transition-all shadow-md mb-4">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.113-5.136 4.113-3.41 0-6.166-2.756-6.166-6.166s2.756-6.166 6.166-6.166c1.551 0 2.964.574 4.054 1.514l3.11-3.11C19.254 2.164 15.96 1 12.24 1 5.48 1 0 6.48 0 13.24s5.48 12.24 12.24 12.24c6.76 0 11.76-4.76 11.76-11.76 0-.783-.07-1.537-.2-2.26H12.24z"/>
                </svg>
                تسجيل الدخول بواسطة Google
            </button>

            <div id="authModalStatus" class="text-xs text-center text-gray-400 min-h-[18px]">جاهز للاتصال المباشر...</div>
        </div>
    </div>

    <footer class="p-4 border-t border-slate-800 text-center text-xs text-gray-500 bg-[#0f1626]">
        جميع الحقوق محفوظة لمنصة TRONSPIN © 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
